[package]
name = "cube-world"
version = "0.1.0"
edition = "2021"
description = "Cube2/Sauerbraten octree geometry — pure Rust, no renderer deps"

[dependencies]
glam     = { version = "0.25", features = ["bytemuck"] }
bytemuck = { version = "1.14", features = ["derive"] }
flate2   = "1.0"           # gzip decompression for .ogz files
tracing  = "0.1"
