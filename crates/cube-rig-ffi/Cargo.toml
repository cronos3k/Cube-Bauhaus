[package]
name = "cube-rig-ffi"
version = "0.1.0"
edition = "2021"
description = "C-ABI FFI bridge exposing the cube-rig IK solver to native engines (Unreal Engine 5, etc.)"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
cube-rig   = { path = "../cube-rig" }
glam       = { version = "0.25", features = ["serde"] }
serde_json = "1.0"
